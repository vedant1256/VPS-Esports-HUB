name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
        
      - name: Generate Android and Assets
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://vps-esports-hub.onrender.com/api
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 623388941554-5pobvg9g2us1mea4p47bg24ekl9k5on3.apps.googleusercontent.com
        run: |
          npm run build
          rm -rf android
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
        
      - name: Build APK (Debug)
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPS-EsportsHub-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
