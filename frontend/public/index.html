<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VPS EsportsHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #14b8a6);
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 8px;
    }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #14b8a6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      padding: 2px;
    }
    .brand-icon-inner {
      width: 100%; height: 100%;
      background: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon-inner svg { width: 28px; height: 28px; fill: #6366f1; }
    .brand h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .brand .sub {
      font-size: 11px;
      color: #14b8a6;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    .brand .sub::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: #5eead4;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .brand p {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
    .google-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .google-btn:active { transform: scale(0.98); }
    .google-btn:hover { background: #f8fafc; }
    .google-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .google-btn svg { width: 20px; height: 20px; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid #e2e8f0;
    }
    .divider span {
      padding: 0 12px;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .web-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .web-btn:active { transform: scale(0.98); }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #ef4444;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .status {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">
          <div class="brand-icon-inner">
            <svg viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4zm0 2.18l7 3.12v4.7c0 4.54-3.14 8.78-7 9.88-3.86-1.1-7-5.34-7-9.88V7.3l7-3.12zM11 7h2v6h-2V7zm0 8h2v2h-2v-2z"/></svg>
          </div>
        </div>
        <h1>VPS EsportsHub</h1>
        <div class="sub">FREE FIRE ARENA</div>
        <p>Welcome back, Champion! ⚡</p>
      </div>

      <div id="error" class="error"></div>

      <button id="googleBtn" class="google-btn" onclick="handleNativeGoogleLogin()">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider"><span>Or use email</span></div>

      <button class="web-btn" onclick="openWebLogin()">
        Login with Email & Password
      </button>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    // CONFIGURATION
    const WEB_CLIENT_ID = '623388941554-5pobvg9g2us1mea4p47bg24ekl9k5on3.apps.googleusercontent.com';
    const BACKEND_URL = 'https://vps-esports-hub.onrender.com/api';
    const FRONTEND_URL = 'https://vps-esportshub-app.vercel.app';

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function setLoading(loading) {
      const btn = document.getElementById('googleBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Connecting...';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:20px;height:20px"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google';
      }
    }

    // NATIVE GOOGLE SIGN-IN (like ChatGPT does it)
    async function handleNativeGoogleLogin() {
      hideError();
      setLoading(true);
      setStatus('Initializing Google Sign-In...');

      try {
        // Import Capacitor plugins
        const { GoogleSignIn } = await import('https://cdn.jsdelivr.net/npm/@capawesome/capacitor-google-sign-in/dist/esm/index.js').catch(() => null) || {};
        
        // Try native Capacitor bridge first
        if (window.Capacitor && window.Capacitor.isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleSignIn) {
          setStatus('Opening Google account picker...');
          
          // Initialize
          await window.Capacitor.Plugins.GoogleSignIn.initialize({
            clientId: WEB_CLIENT_ID,
            scopes: ['email', 'profile']
          });

          // Sign In - this shows the native bottom sheet!
          const result = await window.Capacitor.Plugins.GoogleSignIn.signIn();
          
          setStatus('Authenticating with server...');
          
          const tokenToSend = result.accessToken || result.idToken;
          if (!tokenToSend) throw new Error('No token received from Google');

          // Send to backend
          const response = await fetch(BACKEND_URL + '/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: tokenToSend })
          });

          const data = await response.json();
          
          if (!response.ok) throw new Error(data.error || 'Login failed');
          
          if (data.token) {
            setStatus('Login successful! Loading dashboard...');
            // Store token and navigate to the full web app
            // We use the Capacitor WebView to navigate to the dashboard
            const dashUrl = FRONTEND_URL + '/dashboard?nativeToken=' + encodeURIComponent(data.token);
            window.location.href = dashUrl;
          }
        } else {
          // Capacitor native bridge not available - show helpful message
          showError('Native Google Sign-In is not available. Please use the latest APK from GitHub Actions, or login with Email & Password.');
          setLoading(false);
          setStatus('');
        }
      } catch (err) {
        console.error('Google Login Error:', err);
        if (err.message && err.message.includes('canceled')) {
          setStatus('Sign-in cancelled.');
        } else {
          showError('Google Login Failed: ' + (err.message || 'Unknown error'));
        }
        setLoading(false);
      }
    }

    // Email login - just navigate to the full Vercel website
    function openWebLogin() {
      window.location.href = FRONTEND_URL + '/login';
    }

    // On page load: check if we're in a native app
    window.addEventListener('load', function() {
      if (window.Capacitor && window.Capacitor.isNative) {
        setStatus('Native mode detected ✓');
        // Check if already logged in
        const existingToken = localStorage.getItem('nativeGoogleToken');
        if (existingToken) {
          window.location.href = FRONTEND_URL + '/dashboard?nativeToken=' + encodeURIComponent(existingToken);
        }
      } else {
        setStatus('Web mode - redirecting to full site...');
        // If opened in a regular browser, just go to the website
        setTimeout(function() {
          window.location.href = FRONTEND_URL + '/login';
        }, 1500);
      }
    });
  </script>
</body>
</html>
